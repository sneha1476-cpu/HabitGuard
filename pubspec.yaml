name: habitguard
description: AI-powered personalized digital wellness and smartphone behavior app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter

  flutter_local_notifications: ^22.3.1
  google_sign_in: ^7.2.0
  http: ^1.6.0
  path: ^1.9.1
  provider: ^6.1.2
  sqflite: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true